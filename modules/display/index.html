<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetzgerPost — Bildschirme</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../../shared/style.css" />
  <link rel="stylesheet" href="../angebote/angebote.css" />
  <link rel="stylesheet" href="display.css" />
</head>
<body class="mp-bg-glow">
<nav class="mp-nav" id="mp-nav"></nav>

<main class="ag-main">
  <div class="ag-head">
    <h1>Bildschirme</h1>
    <a class="mp-btn mp-btn-secondary" href="../angebote/index.html" id="link-angebote" style="min-height:44px">Angebote</a>
  </div>
  <p class="ag-sub" id="sub">Was auf den Fernsehern im Laden läuft. Änderungen werden sofort gespeichert und erscheinen spätestens nach 5 Minuten am Bildschirm.</p>

  <div class="dm-screens" id="screens" role="group" aria-label="Bildschirm wählen"></div>
  <div class="dm-panel" id="panel"><div class="ag-empty">Lade …</div></div>

  <p class="ag-hint" style="margin-top:28px;border-top:1px solid var(--border);padding-top:16px">
    Probleme mit der neuen Ansicht? <a href="manager-alt.html" style="color:var(--accent)">Alte Ansicht öffnen</a>.
  </p>
</main>

<div class="mp-toast" id="mp-toast"></div>
<script src="../../shared/supabase.js"></script>
<script src="../../shared/components.js"></script>
<script src="../mittagstisch/config.js"></script>
<script src="../../shared/screen-regeln.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   Display Manager 2.0
   - Vorschau „So läuft's“ rechnet mit shared/screen-regeln.js (= TV)
   - Alles wird sofort gespeichert; Bilddateien werden nie gelöscht
     (nur aus der Anzeige genommen) – alte Ordner bleiben unangetastet
══════════════════════════════════════════════════════════════ */
(function () {
  const R = window.MPRegeln
  const $ = id => document.getElementById(id)
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const BUCKET = 'screen-assets'
  const TAGNAMEN = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa']
  const TAG_REIHE = [1, 2, 3, 4, 5, 6, 0]
  const LAYOUT_BILD = { dienstag: 'assets/Bildschirm_1_Dienstag.jpg', mittwoch: 'assets/Bildschirm_1_Mittwoch.jpg', donnerstag: 'assets/Bildschirm_1_Donnerstag.jpg', freitag: 'assets/Bildschirm_1_Freitag.jpg' }
  const DATEI = { s1: 'screen-v2.html', s2: 'screen2-v2.html', s3: 'screen3-v2.html' }
  const SCREENS = [
    { id: 's1', nr: 1, name: 'Mittagstisch', key: 'screen1' },
    { id: 's2', nr: 2, name: 'Sortiment & Preise', key: 'screen2' },
    { id: 's3', nr: 3, name: 'Aktionen', key: 'screen3' }
  ]

  let K = ''
  let aktiv = 's1'
  let datum = new Date()
  let d = { disp: {}, wochen: [], angebote: [], s2: { slides: [], timer_sekunden: 8 }, s3: { aktive_layouts: [], timer_sekunden: 10 }, s3dateien: [] }
  let manuellAuswahl = { woche: 0, tag: 2 }

  const sb = () => MP.getSB()
  function speicherHinweis () { showToast('✅ Gespeichert – am Bildschirm spätestens in 5 Minuten') }
  function fehler (e) { showToast('Fehler: ' + (e && e.message ? e.message : e), 'error', 5000) }

  /* ── Kunde: Admin darf mit ?kunde=… testen ── */
  function kundeId () {
    const k = new URLSearchParams(location.search).get('kunde')
    if (k && MP.userPlan === 'admin') return k
    return MP.getAktiveKundeId()
  }

  /* ══ Laden ══ */
  async function laden () {
    const q = await Promise.all([
      sb().from('displays').select('screen_id,content,updated_at').eq('kunde_id', K),
      sb().from('wochen').select('*').eq('kunde_id', K).order('gueltig_ab', { ascending: false }).limit(30),
      sb().from('angebote').select('id,titel,status,screens,gueltig_von,gueltig_bis,render_tv_url,updated_at').eq('kunde_id', K).eq('status', 'aktiv'),
      sb().from('screen2_config').select('*').eq('kunde_id', K).limit(1),
      sb().from('screen3_config').select('*').eq('kunde_id', K).limit(1),
      sb().storage.from(BUCKET).list(K + '/screen3', { limit: 200 })
    ])
    d.disp = {}
    ;(q[0].data || []).forEach(z => { d.disp[z.screen_id] = z.content })
    d.wochen = q[1].data || []
    d.angebote = q[2].error ? [] : (q[2].data || [])
    const s2 = q[3].data && q[3].data[0]
    d.s2 = { slides: (s2 && ((s2.slides && s2.slides.length ? s2.slides : null) || s2.aktive_layouts)) || [], timer_sekunden: (s2 && s2.timer_sekunden) || 8 }
    const s3 = q[4].data && q[4].data[0]
    d.s3 = { aktive_layouts: (s3 && s3.aktive_layouts) || [], timer_sekunden: (s3 && s3.timer_sekunden) || 10 }
    d.s3dateien = ((q[5] && q[5].data) || []).filter(f => f.name && !f.name.startsWith('.'))
      .map(f => ({ id: f.name, label: f.name.replace(/_\d{10,}(?=\.)/, '').replace(/\.[^.]+$/, '').replace(/_/g, ' '), bild: url(K + '/screen3/' + f.name) }))
  }
  const url = pfad => sb().storage.from(BUCKET).getPublicUrl(pfad).data.publicUrl
  const sonderListe = () => ((d.disp.sonder_configs && d.disp.sonder_configs.layouts) || [])
  const mtTage = () => (d.disp.mt_settings && d.disp.mt_settings.tage) || R.MT_TAGE_STANDARD.slice()

  /* ══ Speichern ══ */
  async function speichereDisplay (screenId, content) {
    const { error } = await sb().from('displays').upsert({ kunde_id: K, screen_id: screenId, content, updated_at: new Date().toISOString() }, { onConflict: 'kunde_id,screen_id' })
    if (error) throw error
    d.disp[screenId] = content
  }
  const speichereSonder = layouts => speichereDisplay('sonder_configs', Object.assign({}, d.disp.sonder_configs || {}, { layouts }))
  async function speichereS2 () {
    const { error } = await sb().from('screen2_config').upsert({ kunde_id: K, slides: d.s2.slides, timer_sekunden: d.s2.timer_sekunden, updated_at: new Date().toISOString() }, { onConflict: 'kunde_id' })
    if (error) throw error
  }
  async function speichereS3 () {
    const { error } = await sb().from('screen3_config').upsert({ kunde_id: K, aktive_layouts: d.s3.aktive_layouts, timer_sekunden: d.s3.timer_sekunden, updated_at: new Date().toISOString() }, { onConflict: 'kunde_id' })
    if (error) throw error
  }
  async function hochladen (datei, ordner) {
    const ext = (datei.name.split('.').pop() || 'jpg').toLowerCase()
    const basis = datei.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 40) || 'bild'
    const pfad = K + '/' + ordner + '/' + basis + '_' + Date.now() + '.' + ext
    const { error } = await sb().storage.from(BUCKET).upload(pfad, datei, { upsert: false, contentType: datei.type || 'image/jpeg', cacheControl: '31536000' })
    if (error) throw error
    return { pfad, url: url(pfad), label: basis.replace(/_/g, ' ') }
  }

  /* ══ Regeln anwenden (wie der TV) ══ */
  function playlist (screen, tag) {
    if (screen === 's1') return R.playlistScreen1({ screen1: d.disp.screen1, sonder: d.disp.sonder_configs, mtSettings: d.disp.mt_settings, wochen: d.wochen, angebote: d.angebote }, tag)
    if (screen === 's2') return R.playlistBilder('screen2', d.s2.slides, d.angebote, tag, d.s2.timer_sekunden)
    return R.playlistBilder('screen3', d.s3.aktive_layouts, d.angebote, tag, d.s3.timer_sekunden)
  }
  const dauerText = s => s < 60 ? s + ' s' : Math.floor(s / 60) + ' min' + (s % 60 ? ' ' + (s % 60) + ' s' : '')

  /* ══ Oben: Bildschirm-Karten ══ */
  function zeigeKarten () {
    const heute = new Date()
    $('screens').innerHTML = SCREENS.map(s => {
      const p = playlist(s.id, heute)
      const n = p.liste.length
      const nA = new Set(p.liste.filter(x => x.typ === 'angebot').map(x => x.key)).size
      const warn = (p.info || []).filter(i => i.warnung).map(i => i.text)
      return `<button type="button" class="dm-screen" data-screen="${s.id}" aria-pressed="${s.id === aktiv}">
        <span class="dm-screen-top"><span class="dm-screen-nr">${s.nr}</span><span class="dm-screen-name">${esc(s.name)}</span></span>
        <span class="dm-screen-meta">Heute: ${n ? n + ' Folie' + (n > 1 ? 'n' : '') + ' · Runde ' + dauerText(n * p.takt) : 'nichts – Hinweis „Gleich geht’s weiter“'}${nA ? ' · ' + nA + ' Angebot' + (nA > 1 ? 'e' : '') : ''}${p.manuell ? ' · manuell' : ''}</span>
        ${warn.map(w => `<span class="dm-screen-warn">⚠️ ${esc(w)}</span>`).join('')}
      </button>`
    }).join('')
  }

  /* ══ Ablauf-Vorschau ══ */
  function ablaufKarte (screen) {
    const p = playlist(screen, datum)
    const heuteIso = R.isoAus(new Date()), morgenIso = R.isoAus(R.plusTage(new Date(), 1)), gewaehlt = R.isoAus(datum)
    const s = SCREENS.find(x => x.id === screen)
    const folien = p.liste.map((x, i) => {
      const bild = x.art === 'mt' ? LAYOUT_BILD[x.mt.layout] : x.src
      const typ = { mittagstisch: 'Mittagstisch', angebot: 'Angebot', sonder: 'Sonderlayout', bild: 'Bild' }[x.typ] || 'Folie'
      const titel = x.art === 'mt' ? (x.mt.layout.charAt(0).toUpperCase() + x.mt.layout.slice(1)) + ' groß · ' + (x.mt.label || '') : x.titel
      return `<div class="dm-folie"><div class="dm-folie-bild"><img src="${esc(bild)}" alt="" loading="lazy" decoding="async"><span class="dm-folie-nr">${i + 1}</span></div>
        <div class="dm-folie-body"><span class="dm-typ dm-typ-${x.typ}">${typ}</span><span class="dm-folie-titel" title="${esc(titel)}">${esc(titel)}</span></div></div>`
    }).join('')
    const info = (p.info || []).map(i => i.warnung ? `<div class="dm-warn">⚠️ ${esc(i.text)}</div>` : `<div class="dm-regel">${esc(i.regel)} · ${esc(i.text)}</div>`).join('')
    return `<section class="ag-card ag-step" aria-labelledby="h-ablauf">
      <div class="ag-step-head"><span class="ag-step-num">▶</span><h2 id="h-ablauf">So läuft Bildschirm ${s.nr}</h2></div>
      <div class="dm-section-actions">
        <div class="ag-chips">
          <button type="button" class="ag-chip" data-tag="${heuteIso}" aria-pressed="${gewaehlt === heuteIso}">Heute</button>
          <button type="button" class="ag-chip" data-tag="${morgenIso}" aria-pressed="${gewaehlt === morgenIso}">Morgen</button>
        </div>
        <input type="date" class="ag-input" style="max-width:190px;min-height:44px" id="ablauf-datum" value="${gewaehlt}" aria-label="Datum wählen">
        <a class="mp-btn mp-btn-secondary mp-btn-sm" style="min-height:44px" target="_blank" rel="noopener" href="${esc(DATEI[screen] + '?kunde=' + K + (screen === 's1' ? '&screen=screen1' : '') + '&datum=' + gewaehlt + '&debug=1')}">Live-Vorschau ↗</a>
      </div>
      ${p.liste.length
        ? `<div class="dm-ablauf-sum">${p.liste.length} Folie${p.liste.length > 1 ? 'n' : ''}, je ${p.takt} s → eine Runde dauert <strong>${dauerText(p.liste.length * p.takt)}</strong>${p.manuell ? ' · <strong>manueller Modus</strong>' : ''}</div><div class="dm-ablauf" id="ablauf">${folien}</div>`
        : '<div class="ag-empty" id="ablauf">An diesem Tag läuft nichts – der Bildschirm zeigt „Gleich geht’s weiter“.</div>'}
      ${info}
    </section>`
  }

  /* ══ Bildschirm 1 ══ */
  function wocheAktuell (w) { return !!R.aktiveWoche([w], new Date()) }
  function panelS1 () {
    const disp = d.disp.screen1 || {}
    const manuellHeute = disp.manualDay && disp.updatedAt && R.isoAus(new Date(disp.updatedAt)) === R.isoAus(new Date())
    const tage = mtTage()
    const wochen = d.wochen.map((w, i) => {
      const g = w.gerichte || {}
      const namen = R.TAGE.map(t => g[t] && g[t][0] ? g[t][0].name : null).filter(Boolean).join(' · ')
      return `<div class="dm-woche${wocheAktuell(w) ? ' aktuell' : ''}">
        <div class="dm-woche-main"><div class="dm-woche-titel">${esc(w.woche_label || 'Woche')} ${wocheAktuell(w) ? '<span class="mp-badge mp-badge-success" style="margin-left:6px">läuft</span>' : ''}</div><div class="dm-woche-sub">${esc(namen || '—')}</div></div>
        ${w.kw ? `<span class="dm-kw">KW ${w.kw}</span>` : ''}
        <button type="button" class="dm-icon danger" data-aktion="woche-loeschen" data-i="${i}" aria-label="Woche löschen" title="Woche löschen">✕</button>
      </div>`
    }).join('') || '<div class="ag-empty">Noch keine Woche gespeichert. Im Mittagstisch-Generator „Als Woche speichern“.</div>'

    const sonder = sonderListe().map((l, i, arr) => sonderZeile(l, i, arr.length)).join('') || '<div class="ag-empty">Keine Sonderlayouts.</div>'

    return ablaufKarte('s1') + `
    <section class="ag-card ag-step" aria-labelledby="h-mt">
      <div class="ag-step-head"><span class="ag-step-num">1</span><h2 id="h-mt">Mittagstisch</h2></div>
      <div class="ag-field"><span class="ag-label">An welchen Tagen erscheint der Mittagstisch?</span>
        <div class="dm-tage" id="mt-tage">${TAG_REIHE.map(t => `<button type="button" class="dm-tag" data-mt-tag="${t}" aria-pressed="${tage.indexOf(t) >= 0}">${TAGNAMEN[t]}</button>`).join('')}</div>
        <span class="ag-hint">Gerichte gibt es Di–Fr. An Mo/Sa/So wird das Dienstag-Layout gezeigt; Sa/So schon die neue Woche.</span>
      </div>
      <div class="ag-field"><span class="ag-label">Gespeicherte Wochen</span><div class="dm-list" id="wochen">${wochen}</div></div>
      <div class="ag-field"><span class="ag-label">Ausnahme für heute</span>
        ${manuellHeute
          ? `<div class="dm-info">Heute läuft <strong>manuell</strong> „${esc(disp.woche || '')}“ mit ${esc(TAGNAMEN[disp.manualDay] || '')} groß (ohne Sonderlayouts/Angebote). Ab morgen wieder automatisch.</div>
             <div><button type="button" class="mp-btn mp-btn-secondary" style="min-height:44px" data-aktion="manuell-aus">Zurück zur Automatik</button></div>`
          : `<div class="ag-hint">Normalerweise läuft alles automatisch. Nur falls heute eine bestimmte Woche/ein bestimmter Tag gezeigt werden soll:</div>
             <div class="ag-row">
               <select class="ag-input" id="manuell-woche" style="flex:2 1 220px" aria-label="Woche">${d.wochen.map((w, i) => `<option value="${i}"${i === manuellAuswahl.woche ? ' selected' : ''}>${esc(w.woche_label || 'Woche ' + (i + 1))}</option>`).join('')}</select>
               <div class="ag-seg" id="manuell-tag" style="flex:1 1 220px" role="group" aria-label="Tag">${[2, 3, 4, 5].map(t => `<button type="button" data-tag="${t}" aria-pressed="${manuellAuswahl.tag === t}">${TAGNAMEN[t]}</button>`).join('')}</div>
             </div>
             <div><button type="button" class="mp-btn mp-btn-secondary" style="min-height:44px" data-aktion="manuell-an" ${d.wochen.length ? '' : 'disabled'}>Nur heute so anzeigen</button></div>`}
      </div>
      <div class="dm-section-actions"><a class="mp-btn mp-btn-secondary mp-btn-sm" style="min-height:44px" href="screen.html?kunde=${esc(K)}&screen=screen1&editor=true">Positionen &amp; Schriften bearbeiten</a></div>
    </section>
    <section class="ag-card ag-step" aria-labelledby="h-sonder">
      <div class="ag-step-head"><span class="ag-step-num">2</span><h2 id="h-sonder">Sonderlayouts</h2></div>
      <div class="ag-hint">Eigene Bilder, die im Wechsel mit dem Mittagstisch laufen – an bestimmten Wochentagen oder an einem Datum. „Pausieren“ nimmt ein Bild aus der Runde, ohne es zu löschen.</div>
      <div class="dm-list" id="sonder-liste">${sonder}</div>
      <label class="dm-upload">＋ Sonderlayout hochladen<input type="file" accept="image/*" data-upload="sonder"></label>
    </section>` + optimierenKarte()
  }

  function sonderZeile (l, i, n) {
    const istDatum = l.type === 'datum'
    const pausiert = l.aktiv === false
    return `<div class="dm-row${pausiert ? ' pausiert' : ''}" data-i="${i}">
      <img class="dm-row-bild" src="${esc(l.bild)}" alt="" loading="lazy" decoding="async">
      <div class="dm-row-main">
        <input class="dm-name" value="${esc(l.label || '')}" data-feld="label" aria-label="Name">
        <div class="dm-wann">
          <div class="ag-seg" role="group" aria-label="Wann"><button type="button" data-wann="wochentage" aria-pressed="${!istDatum}">Wochentage</button><button type="button" data-wann="datum" aria-pressed="${istDatum}">Datum</button></div>
          ${istDatum
            ? `<input type="date" value="${esc(l.datum || '')}" data-feld="datum" aria-label="Datum">`
            : `<div class="dm-tage">${TAG_REIHE.map(t => `<button type="button" class="dm-tag" data-sonder-tag="${t}" aria-pressed="${(l.wochentage || []).indexOf(t) >= 0}">${TAGNAMEN[t]}</button>`).join('')}</div>`}
        </div>
      </div>
      <div class="dm-row-actions">
        <label class="dm-switch"><input type="checkbox" data-feld="aktiv" ${pausiert ? '' : 'checked'}> ${pausiert ? 'pausiert' : 'läuft'}</label>
        <button type="button" class="dm-icon" data-aktion="hoch" ${i === 0 ? 'disabled' : ''} aria-label="nach vorne">↑</button>
        <button type="button" class="dm-icon" data-aktion="runter" ${i === n - 1 ? 'disabled' : ''} aria-label="nach hinten">↓</button>
        <button type="button" class="dm-icon danger" data-aktion="entfernen" aria-label="Entfernen" title="Aus der Liste entfernen">✕</button>
      </div>
    </div>`
  }

  /* ══ Bildschirm 2 ══ */
  function panelS2 () {
    const zeilen = d.s2.slides.map((s, i, arr) => bildZeile(s, i, arr.length, 's2')).join('') || '<div class="ag-empty">Noch keine Bilder.</div>'
    return ablaufKarte('s2') + `
    <section class="ag-card ag-step" aria-labelledby="h-s2">
      <div class="ag-step-head"><span class="ag-step-num">1</span><h2 id="h-s2">Bilder</h2></div>
      <div class="ag-hint">Fertige Bilder (16:9, z. B. aus Canva) – Sortiment, Preislisten, Fertiggerichte. Laufen in dieser Reihenfolge, Angebote für Bildschirm 2 kommen im Wechsel dazu.</div>
      <div class="dm-list" id="bild-liste">${zeilen}</div>
      <label class="dm-upload">＋ Bild hochladen<input type="file" accept="image/*" multiple data-upload="s2"></label>
      ${taktFeld('s2', d.s2.timer_sekunden)}
    </section>` + optimierenKarte()
  }

  /* ══ Bildschirm 3 ══ */
  function panelS3 () {
    const aktivBilder = d.s3.aktive_layouts.map(l => l.bild)
    const weitere = d.s3dateien.filter(f => aktivBilder.indexOf(f.bild) < 0)
    const zeilen = d.s3.aktive_layouts.map((s, i, arr) => bildZeile(s, i, arr.length, 's3')).join('') || '<div class="ag-empty">Keine Aktionsbilder ausgewählt.</div>'
    const bib = weitere.map(f => `<div class="dm-row pausiert"><img class="dm-row-bild" src="${esc(f.bild)}" alt="" loading="lazy" decoding="async">
      <div class="dm-row-main"><strong>${esc(f.label)}</strong><span class="ag-hint">nicht in der Runde</span></div>
      <div class="dm-row-actions"><button type="button" class="mp-btn mp-btn-secondary mp-btn-sm" style="min-height:40px" data-aktion="s3-dazu" data-id="${esc(f.id)}">In die Runde</button></div></div>`).join('')
    return ablaufKarte('s3') + `
    <section class="ag-card ag-step" aria-labelledby="h-s3">
      <div class="ag-step-head"><span class="ag-step-num">1</span><h2 id="h-s3">Aktionsbilder</h2></div>
      <div class="ag-hint">Saison- und Aktionsbilder (Grillsaison, Ostern …). Laufende Angebote für Bildschirm 3 kommen automatisch dazu.</div>
      <div class="dm-list" id="bild-liste">${zeilen}</div>
      ${bib ? `<div class="ag-field"><span class="ag-label">Weitere hochgeladene Bilder</span><div class="dm-list" id="bibliothek">${bib}</div></div>` : ''}
      <label class="dm-upload">＋ Aktionsbild hochladen<input type="file" accept="image/*" multiple data-upload="s3"></label>
      ${taktFeld('s3', d.s3.timer_sekunden)}
    </section>` + optimierenKarte()
  }

  function bildZeile (s, i, n, scr) {
    const pausiert = s.aktiv === false
    return `<div class="dm-row${pausiert ? ' pausiert' : ''}" data-i="${i}">
      <img class="dm-row-bild" src="${esc(s.bild || '')}" alt="" loading="lazy" decoding="async">
      <div class="dm-row-main"><input class="dm-name" value="${esc(s.label || '')}" data-feld="label" aria-label="Name"></div>
      <div class="dm-row-actions">
        <label class="dm-switch"><input type="checkbox" data-feld="aktiv" ${pausiert ? '' : 'checked'}> ${pausiert ? 'pausiert' : 'läuft'}</label>
        <button type="button" class="dm-icon" data-aktion="hoch" ${i === 0 ? 'disabled' : ''} aria-label="nach vorne">↑</button>
        <button type="button" class="dm-icon" data-aktion="runter" ${i === n - 1 ? 'disabled' : ''} aria-label="nach hinten">↓</button>
        <label class="dm-icon" title="Bild ersetzen" style="position:relative">🔄<input type="file" accept="image/*" data-ersetzen="${scr}" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Bild ersetzen"></label>
        <button type="button" class="dm-icon danger" data-aktion="entfernen" aria-label="Entfernen" title="${scr === 's3' ? 'Aus der Runde nehmen' : 'Entfernen'}">✕</button>
      </div>
    </div>`
  }

  function taktFeld (scr, wert) {
    const min = scr === 's2' ? 3 : 5, max = scr === 's2' ? 30 : 60
    return `<div class="ag-field"><span class="ag-label">Wechsel alle</span>
      <div class="dm-takt"><input type="range" min="${min}" max="${max}" value="${wert}" data-takt="${scr}" aria-label="Sekunden pro Bild"><output>${wert} s</output></div></div>`
  }

  /* ══ Bilder optimieren ══ */
  function optimierenKarte () {
    return `<section class="ag-card ag-step" aria-labelledby="h-opt">
      <div class="ag-step-head"><span class="ag-step-num">⚡</span><h2 id="h-opt">Bilder optimieren</h2></div>
      <div class="ag-hint">Große Bilder (über 1 MB) werden auf Fernseh-Größe verkleinert (max. 1920 px breit, JPG) und neu hochgeladen. Die Bildschirme laden dadurch schneller und verbrauchen weniger Daten. Die Originale bleiben erhalten.</div>
      <div id="opt-box"><button type="button" class="mp-btn mp-btn-secondary" style="min-height:44px" data-aktion="opt-pruefen">Bilder prüfen</button></div>
    </section>`
  }
  function alleBildRefs () {
    const refs = []
    sonderListe().forEach(l => l.bild && refs.push({ url: l.bild, name: l.label || 'Sonderlayout' }))
    d.s2.slides.forEach(s => s.bild && refs.push({ url: s.bild, name: s.label || 'Bild' }))
    d.s3.aktive_layouts.forEach(s => s.bild && refs.push({ url: s.bild, name: s.label || 'Aktionsbild' }))
    return refs
  }
  async function groesse (u) {
    try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); return +r.headers.get('content-length') || 0 } catch (e) { return 0 }
  }
  const mb = b => (b / 1048576).toFixed(1).replace('.', ',') + ' MB'
  let optKandidaten = []
  async function optPruefen () {
    $('opt-box').innerHTML = '<div class="ag-hint">Prüfe Bildgrößen …</div>'
    const refs = alleBildRefs()
    const eindeutig = [...new Set(refs.map(r => r.url))]
    const groessen = {}
    await Promise.all(eindeutig.map(async u => { groessen[u] = await groesse(u) }))
    optKandidaten = eindeutig.filter(u => groessen[u] > 1048576).map(u => ({ url: u, size: groessen[u], namen: refs.filter(r => r.url === u).map(r => r.name) }))
    if (!optKandidaten.length) { $('opt-box').innerHTML = '<div class="dm-info">✅ Alle ' + eindeutig.length + ' Bilder sind schon klein genug.</div>'; return }
    const summe = optKandidaten.reduce((a, b) => a + b.size, 0)
    $('opt-box').innerHTML = `<div class="dm-info">${optKandidaten.length} von ${eindeutig.length} Bildern sind groß (zusammen ${mb(summe)}).</div>
      <div class="dm-opt-liste">${optKandidaten.map(k => `<div class="dm-opt-zeile"><span>${esc(k.namen.join(', '))}</span><span>${mb(k.size)}</span></div>`).join('')}</div>
      <div><button type="button" class="mp-btn mp-btn-primary" style="min-height:44px" data-aktion="opt-los">Jetzt optimieren</button></div>`
  }
  function verkleinere (blob) {
    return createImageBitmap(blob).then(bmp => {
      const f = Math.min(1, 1920 / bmp.width)
      const c = document.createElement('canvas')
      c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f)
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height)
      return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Umwandeln fehlgeschlagen')), 'image/jpeg', 0.85))
    })
  }
  async function optLos () {
    $('opt-box').innerHTML = '<div class="dm-progress"><div id="opt-bar"></div></div><div class="ag-hint" id="opt-text">Starte …</div>'
    const neu = {}, fehlerListe = []
    let vorher = 0, nachher = 0
    for (let n = 0; n < optKandidaten.length; n++) {
      const k = optKandidaten[n]
      $('opt-text').textContent = (n + 1) + ' / ' + optKandidaten.length + ': ' + k.namen[0]
      try {
        const blob = await (await fetch(k.url, { cache: 'no-store' })).blob()
        const klein = await verkleinere(blob)
        if (klein.size < blob.size) {
          const name = (k.url.split('/').pop().split('?')[0].replace(/\.[^.]+$/, '') || 'bild') + '_opt.jpg'
          const pfad = K + '/optimiert/' + Date.now() + '_' + name
          const { error } = await sb().storage.from(BUCKET).upload(pfad, klein, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false })
          if (error) throw error
          neu[k.url] = url(pfad); vorher += blob.size; nachher += klein.size
        }
      } catch (e) { fehlerListe.push(k.namen[0] + ': ' + (e.message || e)) }
      $('opt-bar').style.width = Math.round((n + 1) / optKandidaten.length * 100) + '%'
    }
    // Verweise umstellen (Original-Adresse wird gemerkt) und speichern
    try {
      const tausche = x => (neu[x.bild] ? Object.assign({}, x, { bild: neu[x.bild], original: x.original || x.bild }) : x)
      if (sonderListe().some(l => neu[l.bild])) await speichereSonder(sonderListe().map(tausche))
      if (d.s2.slides.some(s => neu[s.bild])) { d.s2.slides = d.s2.slides.map(tausche); await speichereS2() }
      if (d.s3.aktive_layouts.some(s => neu[s.bild])) { d.s3.aktive_layouts = d.s3.aktive_layouts.map(tausche); await speichereS3() }
    } catch (e) { fehlerListe.push('Speichern: ' + (e.message || e)) }
    const anzahl = Object.keys(neu).length
    alles()
    $('opt-box').innerHTML = `<div class="dm-info">✅ ${anzahl} Bild${anzahl === 1 ? '' : 'er'} optimiert: ${mb(vorher)} → ${mb(nachher)}.</div>` +
      (fehlerListe.length ? `<div class="dm-warn">Nicht geklappt: ${esc(fehlerListe.join(' · '))}</div>` : '')
    if (anzahl) speicherHinweis()
  }

  /* ══ Zeichnen ══ */
  function alles () {
    zeigeKarten()
    $('panel').innerHTML = aktiv === 's1' ? panelS1() : aktiv === 's2' ? panelS2() : panelS3()
    $('panel').setAttribute('data-screen', aktiv)
  }

  /* ══ Bedienung ══ */
  function liste () { return aktiv === 's1' ? sonderListe().slice() : aktiv === 's2' ? d.s2.slides.slice() : d.s3.aktive_layouts.slice() }
  async function speichereListe (l) {
    if (aktiv === 's1') await speichereSonder(l)
    else if (aktiv === 's2') { d.s2.slides = l; await speichereS2() }
    else { d.s3.aktive_layouts = l; await speichereS3() }
  }
  async function aendere (fn, neuZeichnen = true) {
    try { await fn(); speicherHinweis() } catch (e) { fehler(e) }
    if (neuZeichnen) alles(); else zeigeKarten()
  }

  function verbinde () {
    $('screens').addEventListener('click', e => {
      const b = e.target.closest('[data-screen]'); if (!b) return
      aktiv = b.dataset.screen
      try { localStorage.setItem('mp_dm_screen', aktiv) } catch (x) {}
      alles()
    })
    const p = $('panel')
    p.addEventListener('click', async e => {
      const t = e.target
      const chip = t.closest('[data-tag]')
      if (chip && chip.closest('.ag-chips')) { datum = R.ausIso(chip.dataset.tag); return alles() }
      if (chip && chip.closest('#manuell-tag')) { manuellAuswahl.tag = +chip.dataset.tag; return alles() }
      const mt = t.closest('[data-mt-tag]')
      if (mt) {
        const tag = +mt.dataset.mtTag, tage = mtTage().slice(), i = tage.indexOf(tag)
        if (i >= 0) tage.splice(i, 1); else tage.push(tag)
        tage.sort()
        return aendere(() => speichereDisplay('mt_settings', Object.assign({}, d.disp.mt_settings || {}, { tage })))
      }
      const row = t.closest('.dm-row[data-i]')
      const i = row ? +row.dataset.i : -1
      const st = t.closest('[data-sonder-tag]')
      if (st && row) {
        const l = sonderListe().slice(), tag = +st.dataset.sonderTag
        const w = (l[i].wochentage || []).slice(), k = w.indexOf(tag)
        if (k >= 0) w.splice(k, 1); else w.push(tag)
        l[i] = Object.assign({}, l[i], { wochentage: w.sort() })
        return aendere(() => speichereSonder(l))
      }
      const wann = t.closest('[data-wann]')
      if (wann && row) {
        const l = sonderListe().slice()
        if (l[i].type === wann.dataset.wann) return
        l[i] = Object.assign({}, l[i], { type: wann.dataset.wann })
        if (wann.dataset.wann === 'datum' && !l[i].datum) l[i].datum = R.isoAus(new Date())
        if (wann.dataset.wann === 'wochentage' && !l[i].wochentage) l[i].wochentage = [0, 1, 2, 3, 4, 5, 6]
        return aendere(() => speichereSonder(l))
      }
      const akt = t.closest('[data-aktion]'); if (!akt) return
      const a = akt.dataset.aktion
      if (a === 'hoch' || a === 'runter') {
        const l = liste(), j = a === 'hoch' ? i - 1 : i + 1
        if (j < 0 || j >= l.length) return
        ;[l[i], l[j]] = [l[j], l[i]]
        return aendere(() => speichereListe(l))
      }
      if (a === 'entfernen') {
        const l = liste()
        const frage = aktiv === 's3' ? '„' + esc(l[i].label || 'Bild') + '“ aus der Runde nehmen? Es bleibt unter „Weitere hochgeladene Bilder“.' : '„' + esc(l[i].label || 'Bild') + '“ entfernen? Tipp: „Pausieren“ nimmt es nur vorübergehend raus.'
        if (!await mpConfirm(frage)) return
        l.splice(i, 1)
        return aendere(() => speichereListe(l))
      }
      if (a === 's3-dazu') {
        const f = d.s3dateien.find(x => x.id === akt.dataset.id); if (!f) return
        return aendere(() => speichereListe(d.s3.aktive_layouts.concat([{ id: f.id, label: f.label, bild: f.bild }])))
      }
      if (a === 'woche-loeschen') {
        const w = d.wochen[+akt.dataset.i]; if (!w) return
        if (!await mpConfirm('Woche „' + esc(w.woche_label || '') + '“ löschen? Sie verschwindet vom Bildschirm.')) return
        return aendere(async () => { const { error } = await sb().from('wochen').delete().eq('id', w.id); if (error) throw error; d.wochen = d.wochen.filter(x => x.id !== w.id) })
      }
      if (a === 'manuell-an') {
        const w = d.wochen[+(($('manuell-woche') || {}).value || 0)]; if (!w) return
        const content = { type: 'mittagstisch', woche: w.woche_label || '', gerichte: w.gerichte || {}, manualDay: manuellAuswahl.tag, updatedAt: new Date().toISOString() }
        return aendere(() => speichereDisplay('screen1', content))
      }
      if (a === 'manuell-aus') return aendere(() => speichereDisplay('screen1', { type: 'mittagstisch', woche: '', gerichte: {}, updatedAt: new Date().toISOString() }))
      if (a === 'opt-pruefen') return optPruefen()
      if (a === 'opt-los') return optLos()
    })
    p.addEventListener('input', e => {
      const t = e.target
      if (t.dataset.takt && t.nextElementSibling) t.nextElementSibling.textContent = t.value + ' s'
    })
    p.addEventListener('change', async e => {
      const t = e.target
      if (t.id === 'ablauf-datum' && t.value) { datum = R.ausIso(t.value); return alles() }
      if (t.id === 'manuell-woche') { manuellAuswahl.woche = +t.value; return }
      if (t.dataset.takt) {
        const v = +t.value
        if (t.dataset.takt === 's2') { d.s2.timer_sekunden = v; return aendere(speichereS2) }
        d.s3.timer_sekunden = v; return aendere(speichereS3)
      }
      const row = t.closest('.dm-row[data-i]')
      const i = row ? +row.dataset.i : -1
      if (row && t.dataset.feld) {
        const l = liste()
        const neu = Object.assign({}, l[i])
        if (t.dataset.feld === 'aktiv') { if (t.checked) delete neu.aktiv; else neu.aktiv = false }
        else neu[t.dataset.feld] = t.value
        l[i] = neu
        return aendere(() => speichereListe(l), t.dataset.feld !== 'label')
      }
      if (t.dataset.ersetzen && row) {
        const datei = t.files && t.files[0]; if (!datei) return
        showToast('⏳ Hochladen …')
        return aendere(async () => {
          const up = await hochladen(datei, t.dataset.ersetzen === 's2' ? 'screen2' : 'screen3')
          const l = liste(); l[i] = Object.assign({}, l[i], { bild: up.url }); await speichereListe(l)
        })
      }
      if (t.dataset.upload) {
        const dateien = [...(t.files || [])]; if (!dateien.length) return
        showToast('⏳ Hochladen …')
        return aendere(async () => {
          for (const datei of dateien) {
            if (t.dataset.upload === 'sonder') {
              const up = await hochladen(datei, 'screen1/sonder')
              await speichereSonder(sonderListe().concat([{ id: up.pfad.split('/').pop(), label: up.label, bild: up.url, type: 'wochentage', wochentage: [0, 1, 2, 3, 4, 5, 6] }]))
            } else if (t.dataset.upload === 's2') {
              const up = await hochladen(datei, 'screen2')
              d.s2.slides = d.s2.slides.concat([{ label: up.label, bild: up.url, sektionen: [] }]); await speichereS2()
            } else {
              const up = await hochladen(datei, 'screen3')
              const id = up.pfad.split('/').pop()
              d.s3dateien.push({ id, label: up.label, bild: up.url })
              d.s3.aktive_layouts = d.s3.aktive_layouts.concat([{ id, label: up.label, bild: up.url }]); await speichereS3()
            }
          }
        })
      }
    })
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const user = await mpInit({ nav: { backUrl: '../../dashboard.html', backLabel: 'Dashboard' } })
    if (!user) return
    K = kundeId()
    try { const s = localStorage.getItem('mp_dm_screen'); if (s && DATEI[s]) aktiv = s } catch (x) {}
    const scr = new URLSearchParams(location.search).get('screen'); if (scr && DATEI[scr]) aktiv = scr
    if (new URLSearchParams(location.search).get('kunde') === K) $('sub').textContent = 'Testmodus: Kunde „' + K + '“. ' + $('sub').textContent
    verbinde()
    try { await laden() } catch (e) { $('panel').innerHTML = '<div class="ag-empty">Konnte nicht laden: ' + esc(e.message || e) + '</div>'; return }
    alles()
  })
})()
</script>
</body>
