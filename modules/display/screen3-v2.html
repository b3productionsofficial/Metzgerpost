<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MetzgerPost — Screen 3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;width:100vw;height:100vh;overflow:hidden}
    body{cursor:none;display:flex;align-items:center;justify-content:center}
    #screen{position:relative;width:100vw;height:calc(100vw * 9/16);max-height:100vh;max-width:calc(100vh * 16/9);overflow:hidden;background:#000}
    .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
    .slide.active{opacity:1}
    .slide img{width:100%;height:100%;object-fit:cover;display:block}
    #timer-bar{position:absolute;bottom:0;left:0;height:6px;width:0;background:#2d6a4f}
    #no-content{display:none;position:absolute;inset:0;background:#e8e4de;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:Georgia,serif;color:#2d4a2d;text-align:center}
    #no-content.show{display:flex}
    #no-content h1{font-size:3.5vw}
    #no-content p{font-size:1.6vw;color:#666}
    #debug{position:absolute;top:8px;left:8px;z-index:10;background:rgba(0,0,0,.7);color:#fff;font:12px/1.4 monospace;padding:6px 8px;border-radius:4px;display:none;white-space:pre}
  </style>
</head>
<body>
<div id="screen">
  <div id="slides"></div>
  <div id="timer-bar"></div>
  <div id="no-content"><h1>Gleich geht’s weiter</h1><p>Zurzeit sind keine Inhalte aktiv.</p></div>
  <div id="debug"></div>
</div>

<script>
/* ══════════════════════════════════════════════
   Screen 3 (v2): Aktionsbilder + laufende Angebote
   - Angebote erscheinen/verschwinden automatisch nach Datum
   - Nachladen per Realtime UND alle 5 Minuten (falls Realtime ausfällt)
   - Bilder werden vorgeladen und nur einmal geladen (spart Datenvolumen)
   - Nächtlicher Neustart als Sicherheitsnetz
   Parameter: ?kunde=<id>  optional: &datum=YYYY-MM-DD (Test), &debug=1
══════════════════════════════════════════════ */
var SUPABASE_URL  = 'https://jfrqbchgrpixwlecerax.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmcnFiY2hncnBpeHdsZWNlcmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1ODk5NDksImV4cCI6MjA5MDE2NTk0OX0.AnSqi2rJ46PN8dm6zMUgRDNMdXlwRRaES4JQ4Fozn10';
var RESYNC_MS     = 5 * 60 * 1000;
var RELOAD_STUNDE = 3; // nächtlicher Neustart gegen 3 Uhr

var params    = new URLSearchParams(location.search);
var KUNDE_ID  = params.get('kunde') || 'demo';
var TEST_DATUM = /^\d{4}-\d{2}-\d{2}$/.test(params.get('datum') || '') ? params.get('datum') : null;
var DEBUG     = params.get('debug') === '1';

var sb = null;
var playlist = [];       // [{key, src, art}]
var signatur = '';
var index = 0;
var timerSek = 10;
var slideTimer = null;
var bildCache = {};      // src -> Promise<boolean>
var letzterSync = null;
var kanal = null;

function pad(n){ return (n < 10 ? '0' : '') + n; }
function heuteIso(){
  if (TEST_DATUM) return TEST_DATUM;
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function debug(text){
  if (!DEBUG) return;
  var el = document.getElementById('debug');
  el.style.display = 'block';
  el.textContent = text;
}

/* ── Bilder vorladen (jedes Bild nur einmal) ── */
function vorladen(src){
  if (!bildCache[src]) {
    bildCache[src] = new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve(true); };
      img.onerror = function(){ delete bildCache[src]; resolve(false); };
      img.src = src;
    });
  }
  return bildCache[src];
}

/* ── Daten holen ── */
function holeDaten(){
  var heute = heuteIso();
  var cfg = sb.from('screen3_config').select('aktive_layouts,timer_sekunden').eq('kunde_id', KUNDE_ID).limit(1);
  var ang = sb.from('angebote')
    .select('id,titel,render_tv_url,gueltig_von,gueltig_bis,updated_at')
    .eq('kunde_id', KUNDE_ID).eq('status', 'aktiv')
    .contains('screens', ['screen3'])
    .lte('gueltig_von', heute).gte('gueltig_bis', heute)
    .order('gueltig_von', { ascending: true });
  return Promise.all([cfg, ang]).then(function(r){
    if (r[0].error) throw r[0].error;
    // Fehler bei Angeboten (z. B. Tabelle fehlt) dürfen die normalen Bilder nicht stoppen
    var c = (r[0].data && r[0].data[0]) || {};
    var angebote = r[1].error ? [] : (r[1].data || []);
    return { layouts: c.aktive_layouts || [], timer: c.timer_sekunden || 10, angebote: angebote };
  });
}

/* Angebote und Aktionsbilder abwechselnd mischen */
function baueListe(d){
  var bilder = d.layouts.filter(function(l){ return l && l.bild; })
    .map(function(l){ return { key: 'b:' + l.bild, src: l.bild, art: 'bild' }; });
  var angebote = d.angebote.filter(function(a){ return a.render_tv_url; })
    .map(function(a){ return { key: 'a:' + a.id + ':' + a.updated_at, src: a.render_tv_url, art: 'angebot', titel: a.titel }; });
  var liste = [];
  var n = Math.max(bilder.length, angebote.length);
  for (var i = 0; i < n; i++) {
    if (angebote[i]) liste.push(angebote[i]);
    if (bilder[i]) liste.push(bilder[i]);
  }
  return liste;
}

/* ── Anzeige ── */
function zeigeLeer(an){ document.getElementById('no-content').className = an ? 'show' : ''; }

function baueSlides(neu){
  var container = document.getElementById('slides');
  var aktuellerKey = playlist[index] && playlist[index].key;
  container.innerHTML = '';
  neu.forEach(function(item, i){
    var div = document.createElement('div');
    div.className = 'slide';
    div.id = 'slide-' + i;
    var img = document.createElement('img');
    img.alt = '';
    img.src = item.src;
    div.appendChild(img);
    container.appendChild(div);
  });
  playlist = neu;
  // möglichst an derselben Stelle weitermachen
  var pos = -1;
  for (var i = 0; i < neu.length; i++) if (neu[i].key === aktuellerKey) pos = i;
  index = pos >= 0 ? pos : 0;
}

function zeigeSlide(i){
  var alle = document.querySelectorAll('.slide');
  for (var k = 0; k < alle.length; k++) alle[k].className = 'slide' + (k === i ? ' active' : '');
  var bar = document.getElementById('timer-bar');
  bar.style.transition = 'none'; bar.style.width = '0%';
  if (playlist.length > 1) {
    setTimeout(function(){ bar.style.transition = 'width ' + timerSek + 's linear'; bar.style.width = '100%'; }, 50);
  }
}

function starteRotation(){
  if (slideTimer) clearInterval(slideTimer);
  slideTimer = null;
  if (!playlist.length) { zeigeLeer(true); return; }
  zeigeLeer(false);
  zeigeSlide(index);
  if (playlist.length > 1) {
    slideTimer = setInterval(function(){
      index = (index + 1) % playlist.length;
      zeigeSlide(index);
    }, timerSek * 1000);
  }
}

/* ── Synchronisieren ── */
var syncLaeuft = false;
function sync(grund){
  if (!sb || syncLaeuft) return;
  syncLaeuft = true;
  holeDaten().then(function(d){
    var neu = baueListe(d);
    var neueSignatur = neu.map(function(x){ return x.key; }).join('|') + '#' + d.timer;
    letzterSync = new Date();
    if (neueSignatur === signatur) return;
    // erst alle Bilder laden, dann umschalten – kein schwarzes Bild beim Wechsel
    return Promise.all(neu.map(function(x){ return vorladen(x.src); })).then(function(ok){
      var geladen = neu.filter(function(x, i){ return ok[i]; });
      // fehlgeschlagene Bilder beim nächsten Abgleich erneut versuchen
      signatur = geladen.length === neu.length ? neueSignatur : '';
      timerSek = Math.max(3, Math.min(120, d.timer));
      baueSlides(geladen);
      starteRotation();
    });
  }).catch(function(e){
    // offline o. ä.: aktuelle Anzeige einfach weiterlaufen lassen
    if (!playlist.length) zeigeLeer(true);
    if (window.console) console.warn('Sync fehlgeschlagen (' + grund + '):', e && e.message);
  }).then(function(){
    syncLaeuft = false;
    debug('kunde ' + KUNDE_ID + '  datum ' + heuteIso() + '\n' +
      playlist.length + ' Folien (' + playlist.filter(function(x){ return x.art === 'angebot'; }).length + ' Angebote)\n' +
      'letzter Abgleich ' + (letzterSync ? letzterSync.toLocaleTimeString('de-DE') : '–') + '  (' + grund + ')');
  });
}

/* Realtime mit automatischer Wiederverbindung */
var reconnectVersuch = 0;
function verbindeRealtime(){
  if (!sb) return;
  try {
    if (kanal) sb.removeChannel(kanal);
    kanal = sb.channel('sc3v2-' + KUNDE_ID + '-' + Date.now())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'angebote', filter: 'kunde_id=eq.' + KUNDE_ID }, function(){ sync('realtime'); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'screen3_config', filter: 'kunde_id=eq.' + KUNDE_ID }, function(){ sync('realtime'); })
      .subscribe(function(status){
        if (status === 'SUBSCRIBED') { reconnectVersuch = 0; return; }
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          reconnectVersuch++;
          var warte = Math.min(5 * 60, 5 * Math.pow(2, reconnectVersuch)) * 1000;
          setTimeout(verbindeRealtime, warte);
        }
      });
  } catch (e) { /* Polling übernimmt */ }
}

/* Um Mitternacht neu abgleichen, nachts einmal neu laden */
function planeTageswechsel(){
  var jetzt = new Date();
  var mitternacht = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate() + 1, 0, 0, 30);
  setTimeout(function(){ sync('mitternacht'); planeTageswechsel(); }, mitternacht - jetzt);
  var neustart = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate() + (jetzt.getHours() >= RELOAD_STUNDE ? 1 : 0), RELOAD_STUNDE, Math.floor(Math.random() * 20), 0);
  setTimeout(function(){
    if (navigator.onLine === false) return; // offline nicht neu laden, sonst bleibt der Bildschirm leer
    location.reload();
  }, neustart - jetzt);
}

/* Vollbild per Doppelklick (für die Einrichtung am TV) */
document.addEventListener('dblclick', function(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
});

window.addEventListener('DOMContentLoaded', function(){
  if (!window.supabase) { zeigeLeer(true); setTimeout(function(){ location.reload(); }, 60000); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  sync('start');
  verbindeRealtime();
  setInterval(function(){ sync('intervall'); }, RESYNC_MS);
  window.addEventListener('online', function(){ sync('wieder online'); verbindeRealtime(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) sync('sichtbar'); });
  planeTageswechsel();
});
</script>
</body>
</html>
